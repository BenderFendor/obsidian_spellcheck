name: Update ReText dependency lock

on:
  push:
    branches: [feature/retext-offline-grammar]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned ReText dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked packages
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck and bundle
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit verified lockfile to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency lock already up to date.'
          else
            git commit -m 'chore: lock ReText grammar engine dependencies'
            git fetch origin feature/retext-offline-grammar
            git rebase origin/feature/retext-offline-grammar
            git push origin HEAD:feature/retext-offline-grammar
          fi
